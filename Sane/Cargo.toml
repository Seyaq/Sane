[workspace]
members = ["kl", "wm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sane OS"]
license = "MIT"

[workspace.dependencies]
spin       = { version = "0.9", default-features = false, features = ["mutex"] }
bitflags   = { version = "2.4" }
arrayvec   = { version = "0.7", default-features = false }
static_assertions = "1.1"
